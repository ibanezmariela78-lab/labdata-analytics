services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: labdata
      POSTGRES_USER: labdata
      POSTGRES_PASSWORD: ${LABDATA_POSTGRES_PASSWORD:?Definir LABDATA_POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - labdata_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labdata -d labdata"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  labdata_postgres:
